# Sentinel License Service — Fly.io app configuration.
#
# Much smaller footprint than Command Center: no video/HLS workload,
# check-in traffic is one small request per self-hosted install every
# ~15 minutes. The blast radius of a brief deploy-time gap is negligible
# here regardless: an install that hits a check-in mid-deploy just
# retries on its next tick.
#
# The database moved to the shared Postgres cluster (sentinel-sync-db,
# database `sentinel_license`), so the old single-volume constraint on
# rolling deploys no longer applies.

app = "sentinel-license"
primary_region = "sjc"

[build]

[env]
  # DATABASE_URL lives in `fly secrets` now — it points at Postgres and
  # carries a password, and this file is committed. A local run with no
  # DATABASE_URL still falls back to SQLite via app/core/config.py.

# Kept only to hold the pre-migration SQLite file as the rollback copy,
# and because scripts/backup_db.sh still writes here. Once the backup job
# is pg_dump-based (and the rollback window has closed) this mount and
# its volume can go — nothing else on this service touches /data.
[[mounts]]
  source = "sentinel_license_data"
  destination = "/data"

[deploy]
  # `immediate` was a workaround for the single-volume topology, where a
  # rolling deploy's parallel machine couldn't attach the same volume.
  # Now on Postgres, so this uses the default rolling strategy.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero. This service is called by self-hosted Command Center
  # installs on a ~15-minute background tick, so it is idle by default:
  # today, with no self-hosted installs, it serves literally nothing.
  #
  # The previous comment here justified always-warm by claiming a cold
  # start "would routinely leak into the client's grace-period math".
  # That had the scale wrong by four orders of magnitude —
  # SENTINEL_LICENSE_GRACE_HOURS is 72 HOURS, and this service binds its
  # port in ~4s (measured 2026-09-09). A cold start cannot meaningfully
  # consume a three-day window.
  #
  # Three things make scale-to-zero safe here, and all three are worth
  # re-checking before copying this to another service:
  #
  #   1. Boot fits the window. Fly's proxy waits ~8s for an auto-started
  #      machine to bind. 4s clears it. (The Sentinel AI agent needs 10s
  #      and had to be kept warm for exactly this reason.)
  #   2. The caller waits longer than Fly gives up: Command Center's
  #      check-in timeout is 10s.
  #   3. A miss is free. license_client.py treats network/5xx as
  #      "unreachable" and applies the 72-hour grace window, so a failed
  #      check-in is a designed path, not an error path — the next tick
  #      15 minutes later catches it and no customer notices.
  #
  # This flips if a license check ever moves onto a user-blocking path
  # (a synchronous validation on dashboard load). Then a 4s cold start
  # becomes a 4s page stall and this needs to go back to always-warm.
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
