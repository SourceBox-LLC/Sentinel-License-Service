name: Scheduled DB Backup

# Daily portable dump of the production Postgres database.
#
# This service had NO scheduled backup before 2026-09 — it ran SQLite on
# a Fly volume with nothing copying it anywhere. That was a real gap:
# licences are the record of who has paid for what, and re-deriving them
# from Stripe after a loss would be manual and slow.
#
# WHERE BACKUPS ACTUALLY COME FROM
#   The managed cluster's snapshots are the PRIMARY backup. This workflow
#   produces the portable pg_dump that restores onto any Postgres
#   anywhere, so a Fly account/region loss can't take the backups down
#   with the primary.
#
# Mirrors Command Center's .github/workflows/backup.yml step for step —
# same scripts, same encryption, same artifact retention. Keep them in
# sync; if you change one, change the other.
#
# Restore: Command Center's docs/runbooks/DISASTER_RECOVERY.md, using
# this repo's scripts/restore_db.sh.

on:
  schedule:
    # 09:47 UTC — half an hour after Command Center's 09:17 run so the
    # two jobs don't dump the same cluster at the same moment.
    - cron: "47 9 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

        # REQUIRED since this app started scaling to zero (2026-09-09).
        #
        # `flyctl ssh console` does NOT wake a stopped machine. Fly
        # auto-starts on a connection to one of the app's SERVICES; SSH is
        # not that path, so the very next step failed outright with
        # "app sentinel-license has no started VMs" — and it failed
        # SILENTLY, in the sense that nothing but this workflow's own red
        # X reported that a day's backup had not been taken.
        #
        # Starting explicitly is the fix. It is safe when the machine is
        # already running (no-op), and the machine idles back to stopped
        # on its own afterwards, so scale-to-zero is preserved.
      - name: Wake the machine (it scales to zero)
        run: |
          MACHINE=$(flyctl machines list -a sentinel-license --json | jq -r '.[0].id')
          test -n "$MACHINE" && test "$MACHINE" != "null"
          flyctl machine start "$MACHINE" -a sentinel-license || true
          # Give the process time to bind before SSH; boot is ~4s.
          for i in $(seq 1 20); do
            flyctl ssh console -a sentinel-license -C "true" >/dev/null 2>&1 && break
            sleep 3
          done

      - name: Run pg_dump on the machine
        # Runs on the machine so DATABASE_URL stays in Fly and is never
        # copied into GitHub secrets.
        run: |
          flyctl ssh console -a sentinel-license -C "bash /app/scripts/backup_db.sh"

      # Visibility only — never fails the job, but must not fail SILENTLY.
      # The database lives on a different Fly app (sentinel-postgres), and
      # an app-scoped FLY_API_TOKEN cannot see another app: it returns
      # `Could not find App`, indistinguishable from "no snapshots" under
      # a bare `|| true`. See Command Center's copy of this workflow.
      - name: List cluster snapshots (visibility)
        run: |
          if out=$(flyctl volumes list -a sentinel-postgres 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "::warning::Could not read sentinel-postgres volumes. If this says" \
              "'Could not find App', FLY_API_TOKEN is scoped to sentinel-license only" \
              "and cannot see the database app — the backup itself still ran, but" \
              "cluster snapshots are NOT being checked here. Use an org-scoped token" \
              "to restore this visibility."
          fi

      - name: Pull newest dump off the machine
        if: env.BACKUP_KEY != ''
        run: |
          LATEST=$(flyctl ssh console -a sentinel-license -C "sh -c 'ls -1t /data/backups/licenses-*.dump | head -1'" | tr -d '\r' | tail -1)
          echo "newest dump: $LATEST"
          test -n "$LATEST"
          flyctl ssh sftp get "$LATEST" ./backup.dump -a sentinel-license
          ls -lh backup.dump

      - name: Encrypt for off-platform storage
        if: env.BACKUP_KEY != ''
        run: |
          # AES-256-CBC + PBKDF2. Decrypt with:
          #   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
          #     -in backup.dump.enc -out backup.dump -pass pass:<key>
          # then restore with scripts/restore_db.sh.
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in backup.dump -out backup.dump.enc -pass env:BACKUP_KEY
          rm backup.dump
          ls -lh backup.dump.enc

      - name: Store encrypted dump as artifact (30-day retention)
        if: env.BACKUP_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: license-backup-${{ github.run_id }}
          path: backup.dump.enc
          retention-days: 30
          if-no-files-found: error

      # See Command Center's copy: off-platform backups are off by
      # operator decision (2026-09-07), so this is informational rather
      # than a daily ::warning:: about a settled choice.
      - name: Off-platform copy not configured (by design)
        if: env.BACKUP_KEY == ''
        run: |
          echo "BACKUP_ENCRYPTION_KEY is unset — off-platform copies are OFF by choice."
          echo "Backups are Fly-only: managed cluster snapshots plus the portable"
          echo "pg_dump written above. Set the secret to turn artifacts back on."
