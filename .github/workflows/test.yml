name: Test

# Deploy automation is deferred deliberately (see the Sentinel Command
# plan doc, Phase 1: "fine to start with a manual `fly deploy` for the
# very first cut given a human should be watching the first-ever deploy
# of new infrastructure anyway; automate once phase 1 is stable"). This
# workflow only covers lint + dependency audit + tests.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Deployed on Postgres, run locally on SQLite — both have to stay
    # green, so the suite runs against each. fail-fast off so a
    # dialect-specific break shows which engine died and whether the
    # other survived.
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: sqlite
            test_database_url: ""
          - dialect: postgres
            test_database_url: postgresql+psycopg://licensesvc:licensesvc@localhost:5432/license_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: licensesvc
          POSTGRES_PASSWORD: licensesvc
          POSTGRES_DB: license_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check

      - name: Dependency scan (pip-audit)
        run: uv run pip-audit --strict

      # Empty for the sqlite leg; conftest.py falls back to in-memory
      # SQLite when it's unset or blank, so both legs share one command.
      - name: Run tests (${{ matrix.dialect }})
        env:
          TEST_DATABASE_URL: ${{ matrix.test_database_url }}
        run: uv run pytest -v
