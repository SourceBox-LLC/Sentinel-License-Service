name: Test & Deploy

# Tests on every push and PR; deploys to Fly on pushes to master.
#
# Deploy automation was deferred so a human could watch the first-ever
# deploy of new infrastructure, with a note to "automate once phase 1 is
# stable". Phase 1 is stable, and leaving it deferred created a worse
# problem than it avoided: fly.toml became a file that did nothing. A
# scale-to-zero change merged with CI green on 2026-09-09 and never
# reached Fly — the app kept running always-on until someone noticed and
# deployed by hand. Config that silently doesn't apply is more dangerous
# than no config.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Least-privilege token. Without this block a job gets whatever the
# repository's default GITHUB_TOKEN scope is, which is broader than
# anything here needs — CodeQL's actions/missing-workflow-permissions
# flagged every job in this file. Nothing here writes through the API:
# no `gh` calls, no git push, no package publish. Artifact upload does
# not need a contents scope either (it uses the runtime token).
#
# A job that genuinely needs more should declare it at the JOB level
# rather than widening this.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    # No dialect matrix any more. The Python service supported SQLite for
    # local runs and Postgres in production, so the suite ran twice. The
    # Rust build enables only sqlx's `postgres` feature — there is no
    # SQLite code path left to test, and a second leg that skipped every
    # database test was proving nothing.
    #
    # NOTE: this renamed the reported check from "Tests (sqlite)" to
    # "Tests". Branch protection required the old name, and a required
    # check that never reports blocks every PR forever — the protection
    # rule was updated to match in the same change.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: licensesvc
          POSTGRES_PASSWORD: licensesvc
          POSTGRES_DB: license_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      # Not `-D warnings`, matching the sibling repos: a style warning
      # shouldn't go red on arrival and train everyone to ignore the
      # column. This still fails on any clippy *error*.
      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Formatting
        run: cargo fmt --check

      # The wire-contract tests need a real Postgres — they assert the
      # check-in audit row, last_seen writes, and that /entitlements
      # writes nothing, which is where a port breaks. Without
      # TEST_DATABASE_URL they skip themselves, so this is what makes
      # them run.
      - name: Tests
        run: cargo test --locked
        env:
          TEST_DATABASE_URL: postgresql://licensesvc:licensesvc@localhost:5432/license_test

      # RUSTSEC-2023-0071 is ignored, narrowly. It is the Marvin timing
      # attack in `rsa`, which has no fixed version — but `rsa` is not
      # compiled into this binary. It reaches Cargo.lock through
      # `sqlx-mysql`, an OPTIONAL dependency of the sqlx facade that this
      # crate never enables. Cargo.lock records the union of optional
      # dependencies regardless of features, and cargo audit reads the
      # lockfile rather than the built graph. Verified with
      # `cargo tree -e normal | grep sqlx-`: core, macros, macros-core,
      # postgres — no mysql, no rsa. Same waiver as Sentinel-Sync-Service.
      - name: Security advisories (cargo audit)
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --ignore RUSTSEC-2023-0071

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # Waits on BOTH matrix legs (sqlite and postgres) — this service runs
    # the same code against either dialect, so a green sqlite run alone
    # is not evidence the deploy is safe.
    needs: test
    # Push-only: a PR runs the tests above but never ships.
    if: github.event_name == 'push'
    # Serialize so two quick pushes don't race on the machine update.
    concurrency:
      group: deploy-sentinel-license
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --strategy immediate because this app mounts a volume
      # (sentinel_license_data). The default rolling strategy tries to
      # stand up a parallel machine first and errors on the volume's
      # single attachment slot. Sentinel-Sync has no volume and so needs
      # no override; Command Center has the same constraint and the same
      # flag.
      #
      # --ha=false because Fly otherwise provisions TWO machines, which
      # this service does not need and which the volume cannot serve
      # anyway.
      - name: flyctl deploy
        run: flyctl deploy --remote-only --strategy immediate --ha=false --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
