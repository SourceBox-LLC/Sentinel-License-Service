[project]
name = "sentinel-license-service"
version = "0.1.0"
description = "License validation service for self-hosted Sentinel Command Center installs — gates Sentinel AI access for AUTH_PROVIDER=local deployments."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "sqlalchemy>=2.0.51",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.10",
    "sentry-sdk[fastapi]>=2.68.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27.0",
    "ruff>=0.16.3",
    "pip-audit>=2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["F", "E9", "W6", "I", "B", "UP"]
ignore = ["B008", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "B017"]
"**/__init__.py" = ["F401"]
